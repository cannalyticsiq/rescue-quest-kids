<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rescue Quest Kids</title>
<style>
:root{
  --green:#315b4b;
  --red:#a9513e;
  --paper:#fbf6ed;
  --line:#e7dbc9;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#745640}
body{font-family:Arial,Helvetica,sans-serif}
#app{
  width:min(1448px,100vw);
  margin:0 auto;
  position:relative;
}
.screen{
  position:relative;
  width:100%;
  aspect-ratio:1448/1086;
  overflow:hidden;
}
.mockup{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  display:block;
  user-select:none;
  pointer-events:none;
}
.hit{
  position:absolute;
  border:0;
  background:transparent;
  padding:0;
  cursor:pointer;
}
.hit::after{
  content:"";
  position:absolute;
  inset:2px;
  border-radius:14px;
  pointer-events:none;
  opacity:0;
  transition:.14s ease;
}
.hit:hover::after,
.hit.selected::after{
  opacity:1;
  box-shadow:0 0 0 4px rgba(69,108,88,.72);
}
.hit.correct::after{
  opacity:1;
  box-shadow:0 0 0 5px rgba(62,129,86,.9),0 0 22px rgba(62,129,86,.32);
}
.hit.wrong::after{
  opacity:1;
  box-shadow:0 0 0 5px rgba(169,81,62,.9);
}
.tab-hit::after{border-radius:18px}
.toast{
  position:absolute;
  z-index:20;
  left:50%;
  bottom:1.3%;
  transform:translateX(-50%) translateY(8px);
  padding:10px 18px;
  background:rgba(255,251,244,.98);
  border:1px solid rgba(117,88,57,.18);
  border-radius:999px;
  box-shadow:0 10px 25px rgba(0,0,0,.16);
  color:var(--green);
  font-weight:800;
  font-size:clamp(10px,1vw,15px);
  opacity:0;
  transition:.2s ease;
  white-space:nowrap;
  pointer-events:none;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(36,26,20,.56);
  padding:18px;
}
.modal.open{display:flex}
.modal-card{
  width:min(760px,94vw);
  max-height:90vh;
  overflow:auto;
  background:#fffaf3;
  border:1px solid var(--line);
  border-radius:28px;
  padding:20px;
  box-shadow:0 26px 70px rgba(0,0,0,.28);
}
.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.modal h2{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  color:#2d1730;
  font-size:30px;
}
.close{
  width:40px;height:40px;border-radius:13px;border:1px solid var(--line);
  background:#fff7ed;cursor:pointer;font-weight:800;
}
.modal p{color:#6a6158;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-btn{
  border:1px solid var(--line);
  background:#fffdf9;
  border-radius:18px;
  padding:18px;
  font-weight:800;
  color:#24313b;
  cursor:pointer;
}
.modal-btn.good{background:#edf5ef}
.modal-btn.bad{background:#f8e8e2}
.maze-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  max-width:520px;
  margin:16px auto;
  padding:9px;
  background:#866f4a;
  border-radius:18px;
}
.cell{
  aspect-ratio:1;
  border-radius:6px;
  background:#d8b666;
  display:grid;
  place-items:center;
  font-weight:900;
}
.cell.wall{background:#788f5c}
.cell.goal{background:#f4dda0}
.cell.player{outline:4px solid white;outline-offset:-4px}
.pad{
  display:grid;
  grid-template-columns:repeat(3,56px);
  gap:8px;
  justify-content:center;
}
.pad button{
  height:50px;border-radius:13px;border:1px solid var(--line);
  background:#fffdf8;cursor:pointer;font-size:20px
}
.blank{visibility:hidden}

.character{
  position:absolute;
  z-index:10;
  width:10.6%;
  left:28.2%;
  top:53.6%;
  aspect-ratio:1/1.55;
  cursor:pointer;
  transition:left .55s cubic-bezier(.2,.8,.2,1), top .55s cubic-bezier(.2,.8,.2,1), transform .25s ease;
  pointer-events:auto;
}
.character .body{
  width:100%;
  height:100%;
  background:rgba(0,0,0,0);
}
.character.walking{
  animation:bob .28s ease-in-out infinite alternate;
}
@keyframes bob{
  from{transform:translateY(0) rotate(-1deg)}
  to{transform:translateY(-5px) rotate(1deg)}
}

/* cover baked-in dino before showing movable dino */
.patch-cover{
  position:absolute;
  z-index:5;
  left:26.4%;
  top:49.6%;
  width:19.5%;
  height:31.5%;
  background:
    radial-gradient(ellipse at 55% 60%, rgba(190,137,78,.96) 0 14%, transparent 15%),
    linear-gradient(180deg,rgba(191,141,83,.94),rgba(119,91,55,.96));
  filter:blur(12px);
  opacity:.0;
  pointer-events:none;
}

@media(max-width:720px){
  .grid{grid-template-columns:1fr}
  .toast{max-width:90%;white-space:normal;text-align:center}
}
</style>
</head>
<body>
<div id="app">
  <div class="screen" id="screen">
    <img id="mockup" class="mockup" src="assets/mockup-pumpkin-patch.png" alt="Rescue Quest Kids">

    <!-- top world tabs -->
    <button class="hit tab-hit" data-world="patch" style="left:3.1%;top:11.75%;width:21.2%;height:6.15%" aria-label="Pumpkin Patch Path"></button>
    <button class="hit tab-hit" data-world="dino"  style="left:24.3%;top:11.75%;width:20.55%;height:6.15%" aria-label="Dino Hollow"></button>
    <button class="hit tab-hit" data-world="barn"  style="left:44.9%;top:11.75%;width:18.75%;height:6.15%" aria-label="Blocky Barn"></button>
    <button class="hit tab-hit" data-world="maze"  style="left:63.65%;top:11.75%;width:18.85%;height:6.15%" aria-label="Harvest Corn Maze"></button>
    <button class="hit tab-hit" data-world="bay"   style="left:82.45%;top:11.75%;width:13.75%;height:6.15%" aria-label="Moonlit Rescue Bay"></button>
    <button class="hit" id="mapButton" style="left:90.4%;top:11.75%;width:9.4%;height:6.15%" aria-label="World Map"></button>

    <!-- pumpkin patch answer buttons -->
    <div id="patchAnswers">
      <button class="hit answer" data-answer="0" style="left:63.05%;top:46.65%;width:14.2%;height:8.8%"></button>
      <button class="hit answer" data-answer="1" style="left:78.1%;top:46.65%;width:14.25%;height:8.8%"></button>
      <button class="hit answer" data-answer="2" style="left:63.05%;top:56.55%;width:14.2%;height:8.8%"></button>
      <button class="hit answer" data-answer="3" style="left:78.1%;top:56.55%;width:14.25%;height:8.8%"></button>
    </div>

    <!-- corn-maze answer buttons -->
    <div id="mazeAnswers" style="display:none">
      <button class="hit answer" data-answer="0" style="left:63.8%;top:39.75%;width:14.1%;height:7.3%"></button>
      <button class="hit answer" data-answer="1" style="left:78.2%;top:39.75%;width:14.1%;height:7.3%"></button>
      <button class="hit answer" data-answer="2" style="left:63.8%;top:47.8%;width:14.1%;height:7.3%"></button>
      <button class="hit answer" data-answer="3" style="left:78.2%;top:47.8%;width:14.1%;height:7.3%"></button>
    </div>

    <!-- Halloween puzzle cards -->
    <button class="hit" data-puzzle="shadow" style="left:63.45%;top:60.05%;width:10.05%;height:9.15%"></button>
    <button class="hit" data-puzzle="pattern" style="left:74.45%;top:60.05%;width:10.05%;height:9.15%"></button>
    <button class="hit" data-puzzle="find" style="left:85.35%;top:60.05%;width:10.1%;height:9.15%"></button>

    <!-- Hint + Check -->
    <button class="hit" id="hintBtn" style="left:61.1%;top:91.0%;width:15.45%;height:5.1%"></button>
    <button class="hit" id="checkBtn" style="left:75.75%;top:91.0%;width:20.35%;height:5.1%"></button>

    <div class="toast" id="toast"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle">Puzzle</h2>
      <button class="close" id="closeModal">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const PATCH="assets/mockup-pumpkin-patch.png";
const MAZE="assets/mockup-corn-maze.png";

const config={
  patch:{img:PATCH,answer:1,hint:"Compare the pumpkins by their actual size in the picture."},
  dino:{img:PATCH,answer:0,hint:"Look for the egg with the blue spots."},
  barn:{img:PATCH,answer:1,hint:"Count from 5 up to 8."},
  maze:{img:MAZE,answer:2,hint:"Follow the candy clue markers."},
  bay:{img:MAZE,answer:1,hint:"A fair choice gives both friends a chance."}
};

const state={world:"patch",selected:null};
const mockup=document.getElementById("mockup");
const patchAnswers=document.getElementById("patchAnswers");
const mazeAnswers=document.getElementById("mazeAnswers");

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>t.classList.remove("show"),1800);
}

function setWorld(world){
  state.world=world;
  state.selected=null;
  mockup.src=config[world].img;
  patchAnswers.style.display=config[world].img===PATCH?"block":"none";
  mazeAnswers.style.display=config[world].img===MAZE?"block":"none";
  document.querySelectorAll(".answer").forEach(b=>b.classList.remove("selected","correct","wrong"));
}

document.querySelectorAll("[data-world]").forEach(b=>b.onclick=()=>setWorld(b.dataset.world));

document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".answer").forEach(x=>x.classList.remove("selected"));
  b.classList.add("selected");
  state.selected=Number(b.dataset.answer);
});

document.getElementById("hintBtn").onclick=()=>toast(config[state.world].hint);

document.getElementById("checkBtn").onclick=()=>{
  if(state.selected===null)return toast("Choose an answer first.");
  const group=config[state.world].img===PATCH?patchAnswers:mazeAnswers;
  const buttons=[...group.querySelectorAll(".answer")];
  if(state.selected===config[state.world].answer){
    buttons[state.selected].classList.add("correct");
    toast("Correct!");
  } else {
    buttons[state.selected].classList.add("wrong");
    toast("Not quite — try again.");
  }
};

function openModal(title,html){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=html;
  document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open")}

document.querySelector('[data-puzzle="shadow"]').onclick=()=>{
  openModal("Shadow Match",`
    <p>Which silhouette matches a pumpkin?</p>
    <div class="grid">
      <button class="modal-btn mini" data-ok="1">Pumpkin silhouette</button>
      <button class="modal-btn mini" data-ok="0">Ghost silhouette</button>
      <button class="modal-btn mini" data-ok="0">Bat silhouette</button>
      <button class="modal-btn mini" data-ok="0">Leaf silhouette</button>
    </div><p id="miniFb"></p>`);
  document.querySelectorAll(".mini").forEach(b=>b.onclick=()=>{
    b.classList.add(b.dataset.ok==="1"?"good":"bad");
    document.getElementById("miniFb").textContent=b.dataset.ok==="1"?"You got it!":"Try another one.";
  });
};

document.querySelector('[data-puzzle="pattern"]').onclick=()=>{
  openModal("Spooky Pattern Trail",`
    <p style="font-size:32px;text-align:center">🎃 🥚 🎃 🥚 ?</p>
    <div class="grid">
      <button class="modal-btn mini" data-ok="1">🎃 Pumpkin</button>
      <button class="modal-btn mini" data-ok="0">🥚 Egg</button>
      <button class="modal-btn mini" data-ok="0">🍂 Leaf</button>
      <button class="modal-btn mini" data-ok="0">🦇 Bat</button>
    </div><p id="miniFb"></p>`);
  document.querySelectorAll(".mini").forEach(b=>b.onclick=()=>{
    b.classList.add(b.dataset.ok==="1"?"good":"bad");
    document.getElementById("miniFb").textContent=b.dataset.ok==="1"?"Exactly!":"Look at what alternates.";
  });
};

const mazeRows=[
  "WWWWWWW",
  "W...WGW",
  "W.W.W.W",
  "W.W...W",
  "W.WWW.W",
  "WS....W",
  "WWWWWWW"
];
let player={r:5,c:1};

function renderMaze(){
  const g=document.getElementById("mazeGrid");
  g.innerHTML="";
  mazeRows.forEach((row,r)=>[...row].forEach((ch,c)=>{
    const d=document.createElement("div");
    d.className="cell"+(ch==="W"?" wall":"")+(ch==="G"?" goal":"")+(player.r===r&&player.c===c?" player":"");
    if(ch==="G")d.textContent="★";
    if(player.r===r&&player.c===c)d.textContent="●";
    g.appendChild(d);
  }));
}
function moveMaze(dr,dc){
  const nr=player.r+dr,nc=player.c+dc;
  if(mazeRows[nr]?.[nc]&&mazeRows[nr][nc]!=="W"){
    player={r:nr,c:nc};
    renderMaze();
    if(mazeRows[nr][nc]==="G")document.getElementById("miniFb").textContent="You found the scarecrow!";
  }
}
function openMaze(){
  player={r:5,c:1};
  openModal("Harvest Corn Maze",`
    <p>Guide the explorer to the scarecrow.</p>
    <div class="maze-grid" id="mazeGrid"></div>
    <div class="pad">
      <span class="blank"></span><button data-move="-1,0">↑</button><span class="blank"></span>
      <button data-move="0,-1">←</button><button data-move="1,0">↓</button><button data-move="0,1">→</button>
    </div>
    <p id="miniFb" style="text-align:center;color:#315b4b;font-weight:800"></p>`);
  renderMaze();
  document.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>{
    const [dr,dc]=b.dataset.move.split(",").map(Number);
    moveMaze(dr,dc);
  });
}

document.querySelector('[data-puzzle="find"]').onclick=()=>{
  openModal("Find 5 Pumpkins",`
    <p>Find all five pumpkins in the picture.</p>
    <div style="position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:url('${PATCH}') center/cover no-repeat">
      ${[[15,20],[72,18],[38,52],[80,67],[22,78]].map((p,i)=>`<button class="modal-btn fp" data-id="${i}" style="position:absolute;left:${p[0]}%;top:${p[1]}%;width:42px;height:42px;padding:0;border-radius:50%">?</button>`).join("")}
    </div>
    <p id="miniFb">0 / 5 found</p>`);
  const found=new Set();
  document.querySelectorAll(".fp").forEach(b=>b.onclick=()=>{
    found.add(b.dataset.id);b.textContent="✓";b.classList.add("good");
    document.getElementById("miniFb").textContent=`${found.size} / 5 found${found.size===5?" — all found!":""}`;
  });
};

document.getElementById("mapButton").onclick=()=>{
  openModal("World Map",`
    <p>Choose a world.</p>
    <div class="grid">
      <button class="modal-btn world" data-w="patch">Pumpkin Patch Path</button>
      <button class="modal-btn world" data-w="dino">Dino Hollow</button>
      <button class="modal-btn world" data-w="barn">Blocky Barn</button>
      <button class="modal-btn world" data-w="maze">Harvest Corn Maze</button>
      <button class="modal-btn world" data-w="bay">Moonlit Rescue Bay</button>
      <button class="modal-btn" id="playMaze">Play Corn Maze</button>
    </div>`);
  document.querySelectorAll(".world").forEach(b=>b.onclick=()=>{closeModal();setWorld(b.dataset.w)});
  document.getElementById("playMaze").onclick=openMaze;
};

document.getElementById("closeModal").onclick=closeModal;
document.getElementById("modal").onclick=e=>{if(e.target===document.getElementById("modal"))closeModal()};

setWorld("patch");
</script>
</body>
</html>
